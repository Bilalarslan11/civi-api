# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - civi-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: |
            .
            !.git
            !.github
            !.env*
            !node_modules/.cache
            !.next/cache

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_50059796308A4E02AD64D1118415CFFA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09E78CAC894742CA8BA37181F610C020 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6F413371E4C4177B244EDC83F327D3B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'civi-api'
          slot-name: 'Production'
          package: .

      - name: Configure App Service startup
        run: |
          az webapp config appsettings set \
            --name civi-api \
            --resource-group "$(az webapp list --query "[?name=='civi-api'].resourceGroup | [0]" -o tsv)" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
          az webapp config set \
            --name civi-api \
            --resource-group "$(az webapp list --query "[?name=='civi-api'].resourceGroup | [0]" -o tsv)" \
            --startup-file "bash /home/site/wwwroot/startup.sh"          