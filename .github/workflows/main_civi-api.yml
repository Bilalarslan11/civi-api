name: Build and deploy Node.js app to Azure Web App - civi-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: civi-api-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi
          cp startup.sh deploy/startup.sh
          chmod +x deploy/startup.sh
          cd deploy
          zip -qr ../civi-api.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: civi-api.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_50059796308A4E02AD64D1118415CFFA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09E78CAC894742CA8BA37181F610C020 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6F413371E4C4177B244EDC83F327D3B }}

      - name: Configure App Service
        run: |
          az webapp config appsettings set \
            --name civi-api \
            --resource-group zehaidk \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITE_RUN_FROM_PACKAGE=1
          az webapp config set \
            --name civi-api \
            --resource-group zehaidk \
            --startup-file "bash /home/site/wwwroot/startup.sh"

      - name: Clear stale Kudu deployment state
        shell: bash
        run: |
          CREDS="$(az webapp deployment list-publishing-credentials --name civi-api --resource-group zehaidk -o json)"
          USERNAME="$(printf '%s' "$CREDS" | jq -r '.publishingUserName')"
          PASSWORD="$(printf '%s' "$CREDS" | jq -r '.publishingPassword')"
          PUBLISH_URL="$(az webapp deployment list-publishing-profiles --name civi-api --resource-group zehaidk --query "[?publishMethod=='ZipDeploy'].publishUrl | [0]" -o tsv)"
          SCM_HOST="${PUBLISH_URL%%:*}"

          HTTP_CODE="$(curl --silent --show-error \
            --user "$USERNAME:$PASSWORD" \
            --header "Content-Type: application/json" \
            --output /tmp/kudu-command.json \
            --write-out "%{http_code}" \
            --request POST \
            --data '{"command":"rm -f /home/site/locks/status.lock /home/site/locks/info.lock /home/site/deployments/pending; rm -rf /home/site/deployments/temp-*","dir":"/home"}' \
            "https://$SCM_HOST/api/command")"

          cat /tmp/kudu-command.json || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Kudu cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          az webapp restart --name civi-api --resource-group zehaidk
          sleep 10

      - name: Deploy prebuilt package
        run: |
          az webapp deploy \
            --name civi-api \
            --resource-group zehaidk \
            --src-path civi-api.zip \
            --type zip \
            --clean true \
            --restart true \
            --timeout 600000

      - name: Verify App Service is running
        run: |
          STATE="$(az webapp show --name civi-api --resource-group zehaidk --query state -o tsv)"
          echo "App Service state: $STATE"
          test "$STATE" = "Running"
