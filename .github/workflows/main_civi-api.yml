name: Build and deploy Node.js app to Azure Web App - civi-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: civi-api-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi
          cp startup.sh deploy/startup.sh
          chmod +x deploy/startup.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_50059796308A4E02AD64D1118415CFFA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09E78CAC894742CA8BA37181F610C020 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6F413371E4C4177B244EDC83F327D3B }}

      - name: Configure App Service
        run: |
          RESOURCE_GROUP="$(az webapp list --query "[?name==\'civi-api\'].resourceGroup | [0]" -o tsv)"
          test -n "$RESOURCE_GROUP"
          az webapp config appsettings set \
            --name civi-api \
            --resource-group "$RESOURCE_GROUP" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
          az webapp config set \
            --name civi-api \
            --resource-group "$RESOURCE_GROUP" \
            --startup-file "bash /home/site/wwwroot/startup.sh"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'civi-api'
          slot-name: 'Production'
          package: .

      - name: Verify App Service is running
        run: |
          RESOURCE_GROUP="$(az webapp list --query "[?name==\'civi-api\'].resourceGroup | [0]" -o tsv)"
          STATE="$(az webapp show --name civi-api --resource-group "$RESOURCE_GROUP" --query state -o tsv)"
          echo "App Service state: $STATE"
          test "$STATE" = "Running"
